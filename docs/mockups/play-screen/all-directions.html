       <div class=\"p-id\">\n          <h3>Mira <svg class=\"ic ic--solid\" width=\"14\" height=\"14\" role=\"img\" aria-label=\"Favourite\"><use href=\"#i-star\"/></svg><span class=\"tag\" style=\"--c:var(--success)\">Trusts you</span></h3>\n          <p>Scout · <b>Pinned favourite</b></p>\n        </div>\n        <div class=\"p-bond\" data-mira-bond role=\"img\" aria-label=\"Bond 4 of 5\"><span class=\"lbl\">Bond</span><span class=\"num\"><b>4</b>/5</span><i class=\"seg\" style=\"--v:4\"></i></div>\n        <button class=\"p-more\" data-people-toggle aria-label=\"Show or hide Mira's profile\"><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-down\"/></svg></button>\n      </div>\n      <div class=\"p-detail\">\n        <div class=\"p-mem\">\n          <div class=\"sec lbl\">Shared memories</div>\n          <ul class=\"mem\">\n            <li>You shared your rations on the salt flats.</li>\n            <li>You did not use her as bait at the bridge.</li>\n          </ul>\n        </div>\n        <div class=\"p-acts\">\n          <button class=\"act act--pri\"><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n          <button class=\"act\"><span>Spend time together</span></button>\n          <button class=\"act\"><span>Ask about…</span></button>\n        </div>\n      </div>\n    </article>\n\n    <article class=\"person\" style=\"--c:var(--c-tobin)\">\n      <div class=\"p-head\">\n        <span class=\"ava\">T</span>\n        <div class=\"p-id\">\n          <h3>Tobin<span class=\"tag\" style=\"--c:var(--accent)\">Curious</span></h3>\n          <p>Tinkerer's apprentice</p>\n        </div>\n        <div class=\"p-bond\" role=\"img\" aria-label=\"Bond 1 of 5\"><span class=\"lbl\">Bond</span><span class=\"num\"><b>1</b>/5</span><i class=\"seg\" style=\"--v:1\"></i></div>\n        <button class=\"p-more\" data-people-toggle aria-label=\"Show or hide Tobin's profile\"><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-down\"/></svg></button>\n      </div>\n      <div class=\"p-detail\">\n        <div class=\"p-mem\">\n          <div class=\"sec lbl\">Shared memory</div>\n          <ul class=\"mem\">\n            <li>You paid for his broken lens.</li>\n          </ul>\n        </div>\n        <div class=\"p-acts\">\n          <button class=\"act act--pri\"><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n          <button class=\"act\"><span>Spend time together</span></button>\n          <button class=\"act\"><span>Ask about…</span></button>\n        </div>\n      </div>\n    </article>\n\n    <div class=\"grp lbl\">In the scene</div>\n\n    <article class=\"person\" style=\"--c:var(--c-roth)\">\n      <div class=\"p-head\">\n        <span class=\"ava\">R</span>\n        <div class=\"p-id\">\n          <h3>Captain Roth<span class=\"tag\" style=\"--c:var(--warn)\">Wary</span></h3>\n          <p>City Watch · <span class=\"nw\">Not in your party</span></p>\n        </div>\n        <div class=\"p-bond p-bond--none\"><span class=\"lbl\">No bond yet</span><i class=\"seg\" style=\"--v:0\"></i></div>\n      </div>\n      <div class=\"p-row\">\n        <p class=\"p-note\">Suspects a courier carried the forged seal.</p>\n        <button class=\"act p-talk\"><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n      </div>\n    </article>\n\n    <article class=\"person\" style=\"--c:var(--c-extra)\">\n      <div class=\"p-head\">\n        <span class=\"ava\">L</span>\n        <div class=\"p-id\">\n          <h3>Lantern seller</h3>\n          <p>Stranger · No details</p>\n        </div>\n        <button class=\"act p-talk\"><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n      </div>\n    </article>\n  </div>\n</aside>\n\n<main class=\"story\">\n  <div class=\"log\" data-log tabindex=\"0\" aria-label=\"Story log\">\n    <div class=\"log-in\">\n      <h2 class=\"scene\">Scene 4 · Lantern Market · Dusk</h2>\n\n      <div class=\"entry narr\">\n        <p>Paper lanterns sway above the market stalls as the last light drains out of the canal. By the bridge, Captain Roth turns a wax seal over in his gloved hand while two watchmen search a courier's bag.</p>\n      </div>\n\n      <div class=\"entry say\" style=\"--c:var(--c-mira)\">\n        <div class=\"who\"><span class=\"tag\">Mira</span><i>whispering</i></div>\n        <p>\"He's checking couriers. If he sees your satchel, we're done. I can draw them off, or you talk your way through.\"</p>\n      </div>\n\n      <div class=\"entry say\" style=\"--c:var(--c-tobin)\">\n        <div class=\"who\"><span class=\"tag\">Tobin</span></div>\n        <p>\"Or we wait for dark. I vote dark.\"</p>\n      </div>\n\n      <div class=\"entry cmd\">\n        <div class=\"who\"><span class=\"tag\">Aren</span><i>your action</i></div>\n        <span class=\"prompt\" aria-hidden=\"true\">&gt;</span>\n        <p>I walk up to Roth openly and ask whether the bridge is closed, keeping the satchel under my cloak.</p>\n      </div>\n\n      <div class=\"roll\" role=\"group\" aria-label=\"Dice check result\">\n        <div class=\"roll-head\"><span class=\"lbl\">Skill test</span><span class=\"tag\">Medium</span></div>\n        <div class=\"roll-body\">\n          <svg class=\"die\" width=\"56\" height=\"56\" viewBox=\"0 0 56 56\" role=\"img\" aria-label=\"Die showing 2\"><rect x=\"3.5\" y=\"3.5\" width=\"49\" height=\"49\" rx=\"5\"/><circle cx=\"38.5\" cy=\"17.5\" r=\"5\"/><circle cx=\"17.5\" cy=\"38.5\" r=\"5\"/></svg>\n          <div class=\"roll-what\"><b>Manipulation <span>(bluff)</span></b><span>Opposed by Captain Roth</span></div>\n          <div class=\"roll-out\"><b>Success</b><span>Quality <b>2</b></span></div>\n        </div>\n        <div class=\"roll-foot\">\n          <ol class=\"track\" aria-hidden=\"true\"><li class=\"ok\">1</li><li class=\"ok hit\">2</li><li class=\"ok\">3</li><li class=\"ok lim\">4</li><li>5</li><li>6</li></ol>\n          <div class=\"roll-legend\"><span>Needed <b>4 or less</b> on one die</span><span>Rolled <b>2</b></span></div>\n        </div>\n      </div>\n\n      <div class=\"entry narr\">\n        <p>Roth's eyes go from your face to your boots and back. \"Bridge is open. Papers are not,\" he says, but he is already looking past you at a cart with a broken axle. He waves you on.</p>\n      </div>\n\n      <div data-pending>\n        <div class=\"entry say\" style=\"--c:var(--c-mira)\">\n          <div class=\"who\"><span class=\"tag\">Mira</span><i>low, falling in beside you</i></div>\n          <p>\"You could have sent me in as the distraction. You didn't.\" <span class=\"aside\">A pause.</span> \"I noticed.\"</p>\n        </div>\n        <ul class=\"sys\">\n          <li class=\"sys--bond\"><span class=\"tag\">Bond</span><span>Bond with Mira rises from <b>3</b> to <b>4</b>.</span><i class=\"seg\" style=\"--v:4\"></i></li>\n        </ul>\n      </div>\n\n      <div data-pending>\n        <div class=\"entry narr\">\n          <p>Behind you the cart finally gives way, and the whole market turns to look. The bridge ahead is empty, and beyond it the lamps of the Glass Road are being lit one by one.</p>\n        </div>\n        <ul class=\"sys\">\n          <li class=\"sys--xp\"><span class=\"tag\">XP</span><span>+1 experience</span></li>\n          <li class=\"sys--goal\"><span class=\"tag\">Goal</span><span>Goal progress: reach the Glass Road waystation.</span></li>\n          <li class=\"sys--time\"><span class=\"tag\">Time</span><span>10 minutes pass.</span></li>\n        </ul>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"strip\" aria-label=\"People present\">\n    <button class=\"chip chip--party chip--fav\" data-people-toggle style=\"--c:var(--c-mira)\" aria-label=\"Mira, favourite, bond 4 of 5. Open people panel\">\n      <span class=\"ava\">M<svg class=\"ic ic--solid fav\" width=\"13\" height=\"13\" aria-hidden=\"true\"><use href=\"#i-star\"/></svg></span>\n      <span class=\"who2\"><span class=\"nm\">Mira</span><span class=\"bd\" data-mira-bond><i class=\"seg\" style=\"--v:4\"></i><span class=\"num\">4</span></span></span>\n    </button>\n    <button class=\"chip chip--party\" data-people-toggle style=\"--c:var(--c-tobin)\" aria-label=\"Tobin, bond 1 of 5. Open people panel\">\n      <span class=\"ava\">T</span>\n      <span class=\"who2\"><span class=\"nm\">Tobin</span><span class=\"bd\"><i class=\"seg\" style=\"--v:1\"></i><span class=\"num\">1</span></span></span>\n    </button>\n    <button class=\"chip chip--here\" data-people-toggle style=\"--c:var(--c-roth)\" aria-label=\"Captain Roth, no bond yet. Open people panel\">\n      <span class=\"ava\">R</span><span class=\"nm\">Roth</span>\n    </button>\n    <button class=\"chip chip--here\" data-people-toggle style=\"--c:var(--c-extra)\" aria-label=\"Lantern seller. Open people panel\">\n      <span class=\"ava\">L</span><span class=\"nm\">Seller</span>\n    </button>\n    <button class=\"chip chip--all\" data-people-toggle aria-label=\"Open people panel\">\n      <svg class=\"ic\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-up\"/></svg><span class=\"nm\">All</span>\n    </button>\n  </div>\n\n  <div class=\"control\">\n    <div class=\"control-in\">\n      <button class=\"continue\" data-continue>\n        <svg class=\"ic\" width=\"20\" height=\"20\" aria-hidden=\"true\"><use href=\"#i-play\"/></svg>\n        Continue\n        <span class=\"cnt\"><b data-continue-count>2</b> left</span>\n      </button>\n      <div class=\"composer\">\n        <ol class=\"sugg\" aria-label=\"Suggested actions\">\n          <li><button><kbd>1</kbd><span>Cross the bridge now</span><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-chev\"/></svg></button></li>\n          <li><button><kbd>2</kbd><span>Ask Mira what she saw at the stalls</span><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-chev\"/></svg></button></li>\n          <li><button><kbd>3</kbd><span>Take a closer look at the cart</span><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-chev\"/></svg></button></li>\n        </ol>\n        <div class=\"inrow\">\n          <button class=\"to\" aria-label=\"Speaking to everyone. Choose who you address\"><span class=\"lbl\">To:</span><b>All</b><svg class=\"ic\" width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"#i-down\"/></svg></button>\n          <label class=\"field\"><span class=\"prompt\" aria-hidden=\"true\">&gt;</span><input type=\"text\" placeholder=\"What do you do?\" aria-label=\"What do you do?\" autocomplete=\"off\"></label>\n          <button class=\"send\" aria-label=\"Send\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-send\"/></svg></button>\n        </div>\n      </div>\n    </div>\n  </div>\n</main>\n\n<aside class=\"side\" aria-label=\"Character, journal and map\">\n  <section class=\"pnl sheet\" aria-label=\"Character\">\n    <div class=\"pnl-h\">\n      <svg class=\"ic\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-char\"/></svg>\n      <h2>Aren</h2>\n      <span class=\"lbl\">Character</span>\n      <div class=\"end\">\n        <span class=\"lbl dp\">Destiny</span><span class=\"pips\"><i></i><i></i></span><span class=\"num\">2</span>\n        <span class=\"tag\" style=\"--c:var(--success)\">XP 14</span>\n      </div>\n    </div>\n    <div class=\"pnl-b\">\n      <div class=\"sheet-vit\">\n        <div class=\"vital vital--hp\" role=\"img\" aria-label=\"Hit points 12 of 15\">\n          <span class=\"lbl\">Hit points</span><span class=\"num\"><b>12</b>/15</span>\n          <i class=\"seg\" style=\"--max:15;--v:12;--c:var(--hp)\"></i>\n        </div>\n        <div class=\"vital vital--en\" role=\"img\" aria-label=\"Energy 9 of 15\">\n          <span class=\"lbl\">Energy</span><span class=\"num\"><b>9</b>/15</span>\n          <i class=\"seg\" style=\"--max:15;--v:9;--c:var(--energy)\"></i>\n        </div>\n      </div>\n      <div class=\"sec lbl\">Attributes</div>\n      <dl class=\"attrs\">\n        <div><dt>Strength</dt><dd><i class=\"seg\" style=\"--v:1\"></i><span class=\"num\">1</span></dd></div>\n        <div><dt>Skill</dt><dd><i class=\"seg\" style=\"--v:3\"></i><span class=\"num\">3</span></dd></div>\n        <div><dt>Resistance</dt><dd><i class=\"seg\" style=\"--v:3\"></i><span class=\"num\">3</span></dd></div>\n        <div><dt>Armor</dt><dd><i class=\"seg\" style=\"--v:1\"></i><span class=\"num\">1</span></dd></div>\n        <div><dt>Firepower</dt><dd><i class=\"seg\" style=\"--v:0\"></i><span class=\"num\">0</span></dd></div>\n      </dl>\n      <div class=\"sec lbl\">Paths and abilities<span class=\"tag\" style=\"--c:var(--accent)\">Air 2</span><span class=\"tag\" style=\"--c:var(--accent)\">Light 1</span></div>\n      <ul class=\"abil\">\n        <li>Featherstep<span>Air 1</span></li>\n        <li>Gale Push<span>Air 2</span></li>\n        <li>Glimmer<span>Light 1</span></li>\n      </ul>\n      <div class=\"kv\"><span class=\"lbl\">Advantages</span><span>Quick Reflexes · Patron: Couriers' Guild</span></div>\n      <div class=\"kv\"><span class=\"lbl\">Skills</span><span>Manipulation · Survival</span></div>\n    </div>\n  </section>\n\n  <section class=\"pnl journal\" aria-label=\"Journal\">\n    <div class=\"pnl-h\">\n      <svg class=\"ic\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-journal\"/></svg>\n      <h2>Journal</h2>\n      <div class=\"end\"><span class=\"lbl\">2 threads</span></div>\n    </div>\n    <div class=\"pnl-b\">\n      <ul class=\"threads\">\n        <li>\n          <p>Deliver the sealed letter to the Glass Road waystation.</p>\n          <p class=\"sub\"><span class=\"tag\" style=\"--c:var(--accent)\">Next</span><span>Cross the bridge before the gates close.</span></p>\n        </li>\n        <li>\n          <p>Who copied the baron's seal?</p>\n          <p class=\"sub\"><span class=\"tag\">Clue</span><span>Roth carries a copy.</span></p>\n        </li>\n      </ul>\n      <div class=\"commit\">\n        <span class=\"tag\"><svg class=\"ic\" width=\"13\" height=\"13\" aria-hidden=\"true\"><use href=\"#i-clock\"/></svg>Commitment · Due tonight</span>\n        <p>Meet Tobin's master at the Old Mill.</p>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"pnl\" aria-label=\"Map\">\n    <div class=\"pnl-h\">\n      <svg class=\"ic\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-map\"/></svg>\n      <h2>Map</h2>\n      <div class=\"end\"><span class=\"lbl\">Lantern Market</span></div>\n    </div>\n    <div class=\"pnl-b\">\n      <svg class=\"map\" width=\"352\" height=\"134\" viewBox=\"0 0 352 134\" role=\"img\" aria-label=\"Schematic map. Old Mill links to Lantern Market, where you are. Lantern Market links to Canal Bridge and North Gate. Canal Bridge links to Glass Road Waystation, with one undiscovered place beyond it.\">\n        <path class=\"lk\" d=\"M36 74H296M128 74V26\"/>\n        <path class=\"lk lk--un\" d=\"M296 74L328 34\"/>\n        <circle class=\"nd\" cx=\"36\" cy=\"74\" r=\"6\"/>\n        <circle class=\"ring\" cx=\"128\" cy=\"74\" r=\"12\"/>\n        <circle class=\"nd nd--you\" cx=\"128\" cy=\"74\" r=\"6\"/>\n        <circle class=\"nd\" cx=\"212\" cy=\"74\" r=\"6\"/>\n        <circle class=\"nd\" cx=\"296\" cy=\"74\" r=\"6\"/>\n        <circle class=\"nd\" cx=\"128\" cy=\"26\" r=\"6\"/>\n        <circle class=\"nd nd--un\" cx=\"328\" cy=\"30\" r=\"10\"/>\n        <text class=\"q\" x=\"328\" y=\"34.5\">?</text>\n        <text x=\"36\" y=\"100\">Old Mill</text>\n        <text x=\"128\" y=\"104\">Lantern Market</text>\n        <text class=\"you\" x=\"128\" y=\"121\">You are here</text>\n        <text x=\"212\" y=\"56\">Canal Bridge</text>\n        <text x=\"296\" y=\"100\">Glass Road</text>\n        <text x=\"296\" y=\"116\">Waystation</text>\n        <text x=\"142\" y=\"30\" style=\"text-anchor:start\">North Gate</text>\n      </svg>\n    </div>\n  </section>\n</aside>\n\n<nav class=\"tabs\" aria-label=\"Primary\">\n  <button class=\"tab tab--story\" data-people-toggle=\"close\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-story\"/></svg>Story</button>\n  <button class=\"tab tab--people\" data-people-toggle><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-people\"/></svg>People</button>\n  <button class=\"tab\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-char\"/></svg>Character</button>\n  <button class=\"tab\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-journal\"/></svg>Journal</button>\n  <button class=\"tab\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-map\"/></svg>Map</button>\n</nav>\n\n<script>\n(function () {\n  var state = new URLSearchParams(location.search).get('state') || 'continue';\n  var pending = Array.prototype.slice.call(document.querySelectorAll('[data-pending]'));\n  var shown = (state === 'input' || state === 'people') ? pending.length : 0;\n  function sync() {\n    pending.forEach(function (el, i) { el.hidden = i >= shown; });\n    var left = pending.length - shown;\n    document.body.dataset.mode = left > 0 ? 'continue' : 'input';\n    document.querySelectorAll('[data-continue-count]').forEach(function (c) { c.textContent = left; });\n    var log = document.querySelector('[data-log]');\n    var newest = null;\n    document.querySelectorAll('[data-log] .entry').forEach(function (el) {\n      el.removeAttribute('data-new');\n      if (!el.closest('[hidden]')) newest = el;\n    });\n    if (newest) newest.setAttribute('data-new', '');\n    // Mira's bond is 3 until the BOND note in the first pending group is revealed, then 4\n    var bond = shown >= 1 ? 4 : 3;\n    document.querySelectorAll('[data-mira-bond]').forEach(function (el) {\n      var seg = el.querySelector('.seg'); if (seg) seg.style.setProperty('--v', bond);\n      var num = el.querySelector('.num b') || el.querySelector('.num'); if (num) num.textContent = bond;\n      if (el.hasAttribute('aria-label')) el.setAttribute('aria-label', 'Bond ' + bond + ' of 5');\n    });\n    var fav = document.querySelector('.chip--fav');\n    if (fav) fav.setAttribute('aria-label', 'Mira, favourite, bond ' + bond + ' of 5. Open people panel');\n    if (log) log.scrollTop = log.scrollHeight;\n  }\n  if (state === 'people') document.body.dataset.people = 'open';\n  document.addEventListener('click', function (e) {\n    if (e.target.closest('[data-continue]')) { shown = Math.min(pending.length, shown + 1); sync(); }\n    var toggle = e.target.closest('[data-people-toggle]');\n    if (toggle) {\n      var open = document.body.dataset.people === 'open';\n      // a profile toggle on another companion's card moves the open profile to that card\n      var card = toggle.closest('.person'), focus = document.querySelector('.person.is-focus');\n      if (card && card !== focus) {\n        if (focus) focus.classList.remove('is-focus');\n        card.classList.add('is-focus');\n        open = false;\n      }\n      // a control marked \"close\" (the Story tab) only ever closes the panel\n      document.body.dataset.people = (open || toggle.getAttribute('data-people-toggle') === 'close') ? '' : 'open';\n    }\n  });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') document.body.dataset.people = '';\n  });\n  sync();\n})();\n<\/script>\n</body>\n</html>\n"};
(function () {
  var list = document.getElementById('list'), stage = document.getElementById('stage'), view = document.getElementById('view');
  var dock = document.getElementById('dock'), nameEl = document.getElementById('name'), frameBtn = document.getElementById('frameBtn');
  var current = 0;
  function open(i) {
    current = (i + DIRECTIONS.length) % DIRECTIONS.length;
    var d = DIRECTIONS[current];
    nameEl.textContent = (current + 1) + '. ' + d.name;
    view.srcdoc = SOURCES[d.slug];
    stage.classList.add('on');
    dock.classList.add('min');
    document.body.style.overflow = 'hidden';
  }
  function close() { stage.classList.remove('on'); view.srcdoc = ''; document.body.style.overflow = ''; }
  DIRECTIONS.forEach(function (d, i) {
    var b = document.createElement('button'); b.className = 'item';
    var add = function (cls, text) { if (!text) return; var s = document.createElement(cls === 'b' ? 'b' : 'span'); if (cls !== 'b') s.className = cls; s.textContent = text; b.appendChild(s); };
    add('b', (i + 1) + '. ' + d.name); add('tag', d.tagline); add('sum', d.summary);
    add('meta', d.bestFor ? 'Best for: ' + d.bestFor : ''); add('meta', d.weakness ? 'Watch out: ' + d.weakness : '');
    b.addEventListener('click', function () { open(i); });
    list.appendChild(b);
  });
  document.getElementById('peek').addEventListener('click', function () { dock.classList.toggle('min'); });
  document.getElementById('hide').addEventListener('click', function () { dock.classList.add('min'); });
  document.getElementById('back').addEventListener('click', close);
  document.getElementById('prev').addEventListener('click', function () { open(current - 1); });
  document.getElementById('next').addEventListener('click', function () { open(current + 1); });
  frameBtn.addEventListener('click', function () {
    var framed = stage.classList.toggle('framed'); stage.classList.toggle('full', !framed);
    frameBtn.textContent = framed ? 'Full width' : 'Phone size';
  });
})();
