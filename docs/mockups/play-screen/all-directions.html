var DIRECTIONS = [{"slug":"candlelit-codex","name":"Candlelit Codex","tagline":"Dark, warm, bookish","summary":"Reading an adventure novel by candlelight: continuous serif prose on deep warm browns with old-gold accents.","bestFor":"Long reading sessions at night; fantasy and romance told like a novel.","weakness":"Its warmth is in the typography, not the people: companions are initials and small pips. Dark only, and less natural for science fiction."},{"slug":"paper-ink","name":"Paper & Ink","tagline":"Light, typographic","summary":"A well-set paperback: warm paper, ink text, hairline rules and a single accent colour.","bestFor":"Daylight reading; the calmest, most legible page, with mechanics shown like tidy rulebook tables.","weakness":"The quietest for social play: companions are names and pips, with no faces or colour of their own."},{"slug":"slate","name":"Slate","tagline":"Neutral, modern, adaptive","summary":"A clean product interface with dark and light themes whose accent colour comes from the world being played.","bestFor":"A dependable shell for any genre that re-colours itself per world and already has dark and light themes.","weakness":"Looks like a well-made general app rather than a story world; the top area takes a fifth of a phone screen.","themes":["dark","light"]},{"slug":"companion","name":"Companion","tagline":"Messaging style, character-first","summary":"A warm conversation with your party: avatars, bubbles, bond hearts and a contact list of the people you care about.","bestFor":"Playing for the company: party, bonds and favourites are always in view and one tap away.","weakness":"About a third of a phone screen is chrome and speech bubbles cost height, so less story fits per screen. Light theme only so far."},{"slug":"stagelight","name":"Stagelight","tagline":"Visual novel, cinematic","summary":"A stage with the characters on it and a dialogue box that presents the current beat, with choices as buttons.","bestFor":"Character-driven and romance stories: the cast on a lit stage, a spotlight on whoever speaks.","weakness":"The stage takes a quarter of a phone screen, and every scene and character needs art that the app would have to produce for any genre."},{"slug":"arcade-hud","name":"Arcade HUD","tagline":"Game-forward, tactical","summary":"A heads-up display that shows the machinery: segmented bars, dice readouts and tagged system lines.","bestFor":"Players who enjoy the machinery: dice, gauges, costs and bonds shown as instruments.","weakness":"Dense and cool: chrome takes about half a phone screen while typing, and it is the least warm for romance or slice of life."}];
var SOURCES = {"candlelit-codex":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"theme-color\" content=\"#100c08\">\n<title>Bitor Quest - Play (Candlelit Codex)</title>\n<style>\n/* =====================================================================\n   Bitor Quest · Play screen · direction \"Candlelit Codex\"\n   Design tokens. Every rule below is built from these.\n   ===================================================================== */\n:root{\n  color-scheme:dark;\n\n  /* Colour roles: surfaces */\n  --c-desk:#100c08;            /* outside the page: bars, desktop margins */\n  --c-page:#19140f;            /* the reading surface */\n  --c-raise:#221b14;           /* sheets, cards, the input */\n  --c-raise-2:#2b2319;         /* a card on a sheet */\n  --c-backdrop:#0c0906;        /* covers the story behind a sheet */\n  --c-scrim:rgba(8,5,3,.68);   /* dims the chrome behind a sheet */\n\n  /* Colour roles: text */\n  --c-ink:#f1e7d1;             /* newest story text, primary text */\n  --c-ink-read:#d6c9ab;        /* story text already read */\n  --c-ink-2:#bcad8d;           /* secondary text */\n  --c-ink-3:#9c8d70;           /* tertiary text, quiet labels */\n\n  /* Colour roles: accent and lines */\n  --c-gold:#d9a94c;            /* names, ornaments, the active state */\n  --c-gold-hi:#edc673;         /* gold controls, light edge */\n  --c-gold-lo:#c8952f;         /* gold controls, dark edge */\n  --c-gold-deep:#7b5b1d;       /* engraved lines on gold */\n  --c-gold-wash:rgba(217,169,76,.1);\n  --c-on-gold:#1d1508;         /* text on gold */\n  --c-on-gold-wash:rgba(29,21,8,.15);\n  --c-line:#3d3120;            /* hairlines */\n  --c-line-mid:#5d4a28;        /* card edges */\n  --c-line-strong:#8c713d;     /* control borders, gold hairlines */\n\n  /* Colour roles: game meaning */\n  --c-hp:#cb4751;              /* garnet: hit points */\n  --c-hp-ink:#ea858c;\n  --c-en:#5c9da6;              /* muted teal: energy */\n  --c-en-ink:#8cc4cb;\n  --c-bond:#de8f9a;            /* warm rose: bonds */\n  --c-bond-dim:#96676f;        /* an empty bond pip */\n  --c-track:#2b2218;           /* an empty meter */\n\n  /* Effects */\n  --glow-candle:rgba(217,169,76,.12);\n  --glow-bond:0 0 0 2px rgba(222,143,154,.2),0 0 9px 1px rgba(222,143,154,.55);\n  --shadow-pill:inset 0 1px 0 rgba(255,244,214,.6),0 0 0 1px var(--c-gold-deep),0 10px 30px -8px rgba(217,169,76,.5);\n  --shadow-sheet:0 -20px 50px rgba(0,0,0,.55);\n  --shadow-card:0 10px 30px -12px rgba(0,0,0,.6);\n\n  /* Font stacks: the story and the interface share one serif family;\n     only the cost meter, the machine's voice, is set in sans. */\n  --font-story:\"Sitka Text\",\"Iowan Old Style\",\"Palatino Linotype\",\"Noto Serif\",Georgia,serif;\n  --font-display:\"Sitka Heading\",\"Sitka Text\",\"Iowan Old Style\",\"Palatino Linotype\",\"Noto Serif\",Georgia,serif;\n  --font-small:\"Sitka Small\",\"Sitka Text\",\"Iowan Old Style\",\"Palatino Linotype\",\"Noto Serif\",Georgia,serif;\n  --font-ui:\"Segoe UI Variable Text\",\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n\n  /* Type scale */\n  --fs-xs:12px;\n  --fs-sm:13.5px;\n  --fs-md:15px;\n  --fs-lg:17px;\n  --fs-xl:19px;\n  --fs-2xl:22px;\n  --fs-3xl:26px;\n  --fs-story:17px;             /* 18px from 700px up */\n  --lh-story:1.62;\n  --measure:33em;              /* the reading column */\n  --beat-gap:1em;              /* space between story beats */\n  --track-tight:.1em;          /* letter-spacing for small capitals */\n  --track-caps:.14em;\n  --track-wide:.22em;\n\n  /* Spacing steps */\n  --s-0:2px; --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:32px; --s-8:48px;\n\n  /* Radii */\n  --r-xs:3px; --r-sm:6px; --r-md:10px; --r-lg:18px; --r-pill:999px;\n\n  /* Sizes */\n  --tap:44px;                  /* smallest touch target; 40px with a pointer */\n  --control-h:52px;            /* Continue and the input */\n  --disc:40px;                 /* a person's medallion */\n  --disc-lg:48px;\n  --top-h:84px;\n  --nav-h:58px;\n  --gutter:var(--s-5);\n  --sheet-w:640px;             /* widest sheet or bottom control on a tablet */\n  --page-w:736px;              /* desktop: the page */\n  --margin-w:364px;            /* desktop: widest margin column */\n  --margin-min:280px;\n}\n\n/* ============================== Base ============================== */\n*,*::before,*::after{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml,body{height:100%;height:100dvh;margin:0}\nbody{overflow:hidden;background:var(--c-desk);color:var(--c-ink);font:var(--fs-md)/1.4 var(--font-story);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}\nh1,h2,h3,h4,h5,p,ul,ol,dl,dt,dd{margin:0;padding:0;font-size:inherit;font-weight:400}\nul,ol{list-style:none}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}\ninput{font:inherit;color:inherit}\nsvg{display:block;flex:none}\nb{font-weight:700}\n::selection{background:rgba(217,169,76,.3)}\n:focus-visible{outline:2px solid var(--c-gold);outline-offset:2px}\n.sprite{position:absolute;width:0;height:0}\n.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}\n.ic-f{fill:currentColor;stroke:none}\n.dot{color:var(--c-line-strong)}\n.lbl{font:700 var(--fs-xs)/1.3 var(--font-small);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--c-ink-3)}\n.icon-btn{display:grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:50%;color:var(--c-ink-2)}\n\n/* ============================== Shell ============================= */\n.app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--c-page)}\n\n/* ----- Top bar (phone: a running head over the meters) ----- */\n.topbar{position:relative;z-index:5;flex:none;min-height:var(--top-h);display:grid;\n  grid-template-columns:calc(var(--tap) + var(--s-2)) minmax(0,1fr) calc(var(--tap) + var(--s-2));\n  grid-template-rows:repeat(2,calc(var(--tap) / 2)) auto;\n  grid-template-areas:\"menu story cost\" \"menu place cost\" \"meters meters meters\";\n  align-items:center;padding:calc(var(--s-1) + env(safe-area-inset-top,0px)) var(--s-3) var(--s-3);\n  background:var(--c-desk);border-bottom:1px solid var(--c-line)}\n.tb-left,.tb-right{display:contents}\n.brand{display:none}\n.tb-story{grid-area:story;align-self:end;min-width:0;text-align:center}\n.story-name{font:700 var(--fs-xs)/16px var(--font-small);letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--c-gold)}\n.story-ch{display:none}\n.tb-place{grid-area:place;align-self:start;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font:var(--fs-md)/calc(var(--tap) / 2) var(--font-story);color:var(--c-ink-2)}\n.tb-place svg{display:inline-block;vertical-align:-2px;margin-right:var(--s-1);color:var(--c-gold)}\n.place-name{color:var(--c-ink)}\n.tb-cost{grid-area:cost;justify-self:end;font:var(--fs-xs)/1.25 var(--font-ui);color:var(--c-ink-3)}\n.cost-item{display:flex;flex-direction:column-reverse;align-items:flex-end}\n.cost-item b{font-weight:600;font-size:var(--fs-sm);color:var(--c-ink-2);font-variant-numeric:tabular-nums}\n.cost-more{display:none}\n.tb-menu{grid-area:menu;justify-self:start}\n\n.tb-meters{grid-area:meters;display:flex;align-items:center;gap:var(--s-3);margin-top:var(--s-2);padding:0 var(--s-1)}\n.meter{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:var(--s-2)}\n.meter-k{font:700 var(--fs-xs)/1 var(--font-small);letter-spacing:var(--track-tight)}\n.meter--hp .meter-k{color:var(--c-hp-ink)}\n.meter--en .meter-k{color:var(--c-en-ink)}\n.track{flex:1;min-width:var(--s-5);height:6px;border-radius:var(--r-xs);background:var(--c-track);box-shadow:inset 0 0 0 1px var(--c-line-strong);overflow:hidden}\n.track i{display:block;width:var(--v);height:100%;border-radius:var(--r-xs)}\n.meter--hp .track i,.bar--hp .track i{background:var(--c-hp)}\n.meter--en .track i,.bar--en .track i{background:var(--c-en)}\n.meter-v{min-width:2.9em;font:700 var(--fs-sm)/1 var(--font-small);font-variant-numeric:lining-nums tabular-nums;color:var(--c-ink)}   /* one width, so both tracks are the same length */\n.meter-v small{font-weight:400;font-size:var(--fs-xs);color:var(--c-ink-3)}\n.destiny{flex:none;display:flex;align-items:center;gap:var(--s-1);font:700 var(--fs-xs)/1 var(--font-small);letter-spacing:var(--track-tight);text-transform:uppercase;color:var(--c-gold)}\n.destiny b{font-size:var(--fs-sm);letter-spacing:0;color:var(--c-ink);font-variant-numeric:lining-nums}\n\n/* ----- The page: story log, people strip, bottom control ----- */\n.page{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;\n  background:radial-gradient(ellipse 90% 260px at 50% 100%,var(--glow-candle),transparent) var(--c-page)}\n.log{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--s-6) var(--gutter);\n  font-size:var(--fs-story);line-height:var(--lh-story);color:var(--c-ink-read);\n  -webkit-mask-image:linear-gradient(transparent,#000 var(--s-6),#000 calc(100% - var(--s-6)),transparent);\n  mask-image:linear-gradient(transparent,#000 var(--s-6),#000 calc(100% - var(--s-6)),transparent);\n  scrollbar-width:thin;scrollbar-color:var(--c-line) transparent}\n.log:focus-visible{outline-offset:-2px}\n.log-in{max-width:var(--measure);margin:0 auto calc(var(--beat-gap) * -1)}   /* cancels the last beat's own bottom margin */\n\n/* Scene heading */\n.scene{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);margin-bottom:var(--s-6);text-align:center;color:var(--c-gold)}\n.scene-no{display:flex;align-items:center;gap:var(--s-3);font:700 var(--fs-xs)/14px var(--font-small);letter-spacing:.34em;text-transform:uppercase} tton>\n          <button class=\"btn person-talk person-quick\" type=\"button\" aria-label=\"Talk to Mira\"><svg class=\"ic\" width=\"17\" height=\"17\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n          <svg class=\"ic person-chev\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-up\"/></svg>\n        </div>\n        <div class=\"person-detail\">\n          <h5 class=\"lbl\">Shared memories</h5>\n          <ul class=\"memories\">\n            <li>You shared your rations on the salt flats.</li>\n            <li>You did not use her as bait at the bridge.</li>\n          </ul>\n          <div class=\"actions\">\n            <button class=\"btn btn--primary\" type=\"button\"><svg class=\"ic\" width=\"17\" height=\"17\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg>Talk</button>\n            <button class=\"btn\" type=\"button\">Spend time together</button>\n            <button class=\"btn\" type=\"button\">Ask about…</button>\n          </div>\n        </div>\n      </article>\n\n      <article class=\"person person--tobin\">\n        <div class=\"person-head\">\n          <span class=\"disc disc--party\" aria-hidden=\"true\">T</span>\n          <div class=\"person-id\">\n            <h4 class=\"person-name\">Tobin</h4>\n            <p class=\"person-role\">Tinkerer’s apprentice</p>\n            <p class=\"person-bond\"><span class=\"pips\" role=\"img\" aria-label=\"Bond level\"><i class=\"on\"></i><i></i><i></i><i></i><i></i></span> <span>Bond <b>1</b> of 5</span> <span class=\"dot\">·</span> <em>curious</em></p>\n          </div>\n          <button class=\"btn person-talk person-quick\" type=\"button\" aria-label=\"Talk to Tobin\"><svg class=\"ic\" width=\"17\" height=\"17\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n        </div>\n        <div class=\"person-detail\">\n          <ul class=\"memories\">\n            <li>You paid for his broken lens.</li>\n          </ul>\n          <div class=\"actions\">\n            <button class=\"btn btn--primary\" type=\"button\"><svg class=\"ic\" width=\"17\" height=\"17\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg>Talk</button>\n            <button class=\"btn\" type=\"button\">Spend time together</button>\n            <button class=\"btn\" type=\"button\">Ask about…</button>\n          </div>\n        </div>\n      </article>\n\n      <h3 class=\"h-sub\">Also here</h3>\n\n      <article class=\"person person--roth\">\n        <div class=\"person-head\">\n          <span class=\"disc\" aria-hidden=\"true\">R</span>\n          <div class=\"person-id\">\n            <h4 class=\"person-name\">Captain Roth</h4>\n            <p class=\"person-role\">City Watch</p>\n            <p class=\"person-bond\"><span>No bond yet</span> <span class=\"dot\">·</span> <em>wary</em></p>\n          </div>\n          <button class=\"btn person-talk\" type=\"button\" aria-label=\"Talk to Captain Roth\"><svg class=\"ic\" width=\"17\" height=\"17\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n        </div>\n        <p class=\"person-note\">Suspects a courier carried the forged seal.</p>\n      </article>\n\n      <article class=\"person person--seller\">\n        <div class=\"person-head\">\n          <span class=\"disc disc--stranger\" aria-hidden=\"true\">L</span>\n          <div class=\"person-id\">\n            <h4 class=\"person-name\">Lantern seller</h4>\n            <p class=\"person-role\">A stranger</p>\n          </div>\n          <button class=\"btn person-talk\" type=\"button\" aria-label=\"Talk to the lantern seller\"><svg class=\"ic\" width=\"17\" height=\"17\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n        </div>\n      </article>\n    </div>\n  </aside>\n\n  <\!-- ============================ The page ============================ -->\n  <main class=\"page\">\n    <div class=\"log\" data-log role=\"log\" tabindex=\"0\" aria-label=\"Story\">\n      <div class=\"log-in\">\n\n        <header class=\"scene\">\n          <p class=\"scene-no\">\n            <svg width=\"62\" height=\"11\" viewBox=\"0 0 62 11\" aria-hidden=\"true\"><use href=\"#o-rule\"/></svg>\n            <span>Scene 4</span>\n            <svg class=\"flip\" width=\"62\" height=\"11\" viewBox=\"0 0 62 11\" aria-hidden=\"true\"><use href=\"#o-rule\"/></svg>\n          </p>\n          <h2 class=\"scene-title\">Lantern Market <span>·</span> Dusk</h2>\n        </header>\n\n        <p class=\"beat lead\">Paper lanterns sway above the market stalls as the last light drains out of the canal. By the bridge, Captain Roth turns a wax seal over in his gloved hand while two watchmen search a courier’s bag.</p>\n\n        <div class=\"beat say\">\n          <p class=\"who\"><span class=\"who-name\">Mira</span> <span class=\"who-how\">whispering</span></p>\n          <p class=\"line\">“He’s checking couriers. If he sees your satchel, we’re done. I can draw them off, or you talk your way through.”</p>\n        </div>\n\n        <div class=\"beat say\">\n          <p class=\"who\"><span class=\"who-name\">Tobin</span></p>\n          <p class=\"line\">“Or we wait for dark. I vote dark.”</p>\n        </div>\n\n        <div class=\"beat act\">\n          <p class=\"who\"><span class=\"who-name\">Aren</span> <span class=\"who-how\">you</span></p>\n          <p>I walk up to Roth openly and ask whether the bridge is closed, keeping the satchel under my cloak.</p>\n        </div>\n\n        <aside class=\"check\" aria-label=\"Dice check\">\n          <div class=\"check-in\">\n            <div class=\"check-top\">\n              <svg class=\"die die-head\" width=\"32\" height=\"32\" viewBox=\"0 0 38 38\" aria-hidden=\"true\">\n                <rect x=\"1.5\" y=\"1.5\" width=\"35\" height=\"35\" rx=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n                <rect x=\"5\" y=\"5\" width=\"28\" height=\"28\" rx=\"4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\".8\" opacity=\".5\"/>\n                <circle cx=\"13\" cy=\"13\" r=\"3\" fill=\"currentColor\"/>\n                <circle cx=\"25\" cy=\"25\" r=\"3\" fill=\"currentColor\"/>\n              </svg>\n              <div class=\"check-title\">\n                <p class=\"check-kind seps\"><span><span>Skill test</span><span>Medium</span></span></p>\n                <p class=\"check-skill\">Manipulation <em>(bluff)</em></p>\n              </div>\n              <p class=\"stamp\"><b>Success</b> <span>quality 2</span></p>\n            </div>\n            <div class=\"check-facts\">\n              <p class=\"check-need\"><span class=\"check-k\">Needed</span> <span><b>4 or less</b> on one die</span></p>\n              <p><span class=\"check-k\">Rolled</span> <svg class=\"ic die die-roll\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-die2\"/></svg> <b>2</b></p>\n              <p class=\"check-vs\">Opposed by Captain Roth</p>\n            </div>\n          </div>\n        </aside>\n\n        <p class=\"beat\" data-latest>Roth’s eyes go from your face to your boots and back. “Bridge is open. Papers are not,” he says, but he is already looking past you at a cart with a broken axle. He waves you on.</p>\n\n        <div class=\"pending\" data-pending>\n          <div class=\"beat say\">\n            <p class=\"who\"><span class=\"who-name\">Mira</span> <span class=\"who-how\">low, falling in beside you</span></p>\n            <p class=\"line\">“You could have sent me in as the distraction. You didn’t.” A pause. “I noticed.”</p>\n          </div>\n          <div class=\"notes\">\n            <p class=\"note note--bond\"><span class=\"note-i\"><svg class=\"ic\" width=\"15\" height=\"15\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg>Bond with <b>Mira</b> rises from 3 to <b>4</b></span><span class=\"pips\" aria-hidden=\"true\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i><i class=\"rise\"></i><i></i></span></p>\n          </div>\n        </div>\n\n        <div class=\"pending\" data-pending>\n          <p class=\"beat\">Behind you the cart finally gives way, and the whole market turns to look. The bridge ahead is empty, and beyond it the lamps of the Glass Road are being lit one by one.</p>\n          <div class=\"notes\">\n            <p class=\"note\"><span class=\"note-i\"><svg class=\"ic-f\" width=\"13\" height=\"13\" aria-hidden=\"true\"><use href=\"#i-spark\"/></svg><b>+1</b> experience</span> <span class=\"note-sep\">·</span> <span class=\"note-i\"><svg class=\"ic\" width=\"15\" height=\"15\" aria-hidden=\"true\"><use href=\"#i-flag\"/></svg>Goal progress: <span class=\"nw\">reach the Glass Road waystation</span></span></p>\n            <p class=\"note\"><span class=\"note-i\"><svg class=\"ic\" width=\"15\" height=\"15\" aria-hidden=\"true\"><use href=\"#i-clock\"/></svg>10 minutes pass</span></p>\n          </div>\n        </div>\n\n      </div>\n    </div>\n\n    <\!-- People strip (phone) -->\n    <div class=\"strip\" role=\"group\" aria-label=\"People with you\">\n      <button class=\"medal medal--party\" type=\"button\" data-people-toggle aria-label=\"Mira, in your party, favourite. Open People\">\n        <span class=\"disc disc--party\">M<span class=\"fav-badge\"><svg class=\"ic-f\" width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-star\"/></svg></span></span>\n        <span class=\"medal-name\">Mira</span>\n        <span class=\"pips\" aria-hidden=\"true\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i><i class=\"rise\"></i><i></i></span>\n      </button>\n      <button class=\"medal medal--party\" type=\"button\" data-people-toggle aria-label=\"Tobin, in your party. Open People\">\n        <span class=\"disc disc--party\">T</span>\n        <span class=\"medal-name\">Tobin</span>\n        <span class=\"pips\" aria-hidden=\"true\"><i class=\"on\"></i><i></i><i></i><i></i><i></i></span>\n      </button>\n      <span class=\"str oser look at the cart</span><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-right\"/></svg></button></li>\n        </ul>\n        <div class=\"field\">\n          <button class=\"to\" type=\"button\" aria-label=\"Speaking to Mira. Change who you address\"><span class=\"to-k\">To:</span> <span class=\"disc disc--party disc--xs\" aria-hidden=\"true\">M</span> <span class=\"to-name\">Mira</span> <svg class=\"ic\" width=\"13\" height=\"13\" aria-hidden=\"true\"><use href=\"#i-down\"/></svg></button>\n          <input class=\"field-input\" type=\"text\" placeholder=\"What do you do?\" aria-label=\"What do you do?\" autocomplete=\"off\">\n          <button class=\"send\" type=\"button\" aria-label=\"Send\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-send\"/></svg></button>\n        </div>\n      </div>\n    </div>\n  </main>\n\n  <\!-- ================= Character, journal, map (right margin) ================= -->\n  <aside class=\"side\" aria-label=\"Character and journal\">\n    <section>\n      <div class=\"sec-head\"><h2 class=\"h-sec\">Character</h2><span class=\"rule\" aria-hidden=\"true\"></span><button class=\"icon-btn icon-btn--sm\" type=\"button\" aria-label=\"Open the character sheet\"><svg class=\"ic\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-expand\"/></svg></button></div>\n      <div class=\"char-top\">\n        <h3 class=\"char-name\">Aren</h3>\n        <dl class=\"char-tally\">\n          <div><dt><span class=\"sparks\" aria-hidden=\"true\"><svg class=\"ic-f\" width=\"13\" height=\"13\"><use href=\"#i-spark\"/></svg><svg class=\"ic-f\" width=\"13\" height=\"13\"><use href=\"#i-spark\"/></svg></span>Destiny points</dt><dd>2</dd></div>\n          <div><dt>Experience</dt><dd>14</dd></div>\n        </dl>\n      </div>\n      <div class=\"bar bar--hp\"><span>Hit points</span> <span class=\"bar-v\"><b>12</b> / 15</span><span class=\"track\"><i style=\"--v:80%\"></i></span> '[data-continue-count]', function (c) { c.textContent = left; });\n\n    /* Mira's bond rises when the first pending beat is revealed. */\n    var bond = shown > 0 ? '4' : '3';\n    body.dataset.bond = bond;\n    body.classList.toggle('just-rose', byReader === true && shown === 1);\n    each('[data-bond-value]', function (c) { c.textContent = bond; });\n\n    /* The newest beat is lit a little brighter than what has been read. */\n    each('.is-new', function (el) { el.classList.remove('is-new'); });\n    var newest = shown > 0 ? pending[shown - 1] : document.querySelector('[data-latest]');\n    if (newest) newest.classList.add('is-new');\n\n    if (log) log.scrollTop = log.scrollHeight;\n  }\n\n  function advance() {\n    if (shown >= pending.length) return;\n    shown += 1;\n    sync(true);\n  }\n\n  if (state === 'people') body.dataset.people = 'open';\n\n  document.addEventListener('click', function (e) {\n    if (!e.target.closest) return;\n    if (e.target.closest('[data-continue]')) advance();\n    if (e.target.closest('[data-people-toggle]')) {\n      body.dataset.people = body.dataset.people === 'open' ? '' : 'open';\n    }\n  });\n\n  /* Escape closes the People panel. Space continues the story when no control has the focus. */\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape' && body.dataset.people === 'open') { body.dataset.people = ''; return; }\n    if (e.key !== ' ' || body.dataset.mode !== 'continue') return;\n    if (e.target.closest && e.target.closest('button, input, textarea, select, a')) return;\n    e.preventDefault();\n    advance();\n  });\n\n  sync(false);\n  requestAnimationFrame(function () { requestAnimationFrame(function () { body.classList.add('is-ready'); }); });\n})();\n<\/script>\n</body>\n</html>\n","paper-ink":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Bitor Quest - Play (Paper &amp; Ink)</title>\n<meta name=\"theme-color\" content=\"#FBF8F1\">\n<style>\n/* =====================================================================\n   Bitor Quest · Play screen · direction \"Paper & Ink\"\n   A well-set paperback: warm paper, near-black ink, hairline rules,\n   and one accent (vermilion) that always means \"you\".\n   ===================================================================== */\n\n/* ---------- Design tokens ---------- */\n:root {\n  /* colour roles (contrast against --paper in brackets) */\n  --paper: #FBF8F1;          /* page background */\n  --paper-0: rgba(251, 248, 241, 0);\n  --paper-raised: #FFFDF9;   /* People sheet, text field */\n  --paper-sunk: #F3EEE3;     /* hover, pressed and selected wash */\n  --ink: #1C1A17;            /* story text, primary UI text   [16.4:1] */\n  --ink-2: #4A453D;          /* secondary text                [9.0:1] */\n  --ink-3: #655F54;          /* labels, footnote furniture    [6.0:1] */\n  --rule: #DAD3C4;           /* hairlines (decorative) */\n  --rule-2: #BDB5A4;         /* sheet handle, scrollbar thumbs (decorative) */\n  --rule-strong: #8C8577;    /* control borders, empty pips, meter tracks [3.5:1] */\n  --accent: #BF3219;         /* vermilion: Continue, \"You\", bond pips, links [5.4:1] */\n  --accent-strong: #A0280F;  /* pressed accent */\n  --accent-wash: #F7E5DD;    /* selection, accent hover */\n  --on-accent: #FFFDF8;      /* text on accent                [5.6:1] */\n  --scrim: rgba(28, 26, 23, .34);\n  --shadow-sheet: 0 -10px 40px rgba(28, 26, 23, .10);   /* the only shadow */\n\n  /* font stacks (system fonts only) */\n  --font-serif: \"Sitka Text\", \"Iowan Old Style\", \"Palatino Linotype\", \"Noto Serif\", Georgia, serif;\n  --font-display: \"Sitka Subheading\", \"Sitka Text\", \"Iowan Old Style\", \"Palatino Linotype\", \"Noto Serif\", Georgia, serif;\n  --font-sans: \"Segoe UI Variable Text\", \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n\n  /* type scale */\n  --fs-xs: 12px;             /* capital labels, navigation: the smallest size in use */\n  --fs-sm: 13px;             /* meta lines, status, table text */\n  --fs-ui: 14px;             /* buttons, chips, side panels */\n  --fs-note: 15px;           /* footnote-style notes, memories, small serif */\n  --fs-md: 16px;             /* header, scene heading, suggested actions */\n  --fs-story: 17px;          /* story prose: 17px phone, 18px tablet, 19px desktop (17 to 20px by window width) */\n  --fs-lg: 20px;             /* names in lists, Continue */\n  --fs-xl: 24px;             /* sheet title, profile names */\n  --lh-story: 1.6;\n  --track-caps: .1em;        /* capital labels */\n  --track-wide: .16em;       /* spaced small caps: scene heading, Continue, wordmark */\n\n  /* spacing steps (4px grid) */\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 48px;\n  --gutter: 20px;            /* page margin on phones */\n  --measure-max: 620px;      /* reading column at full width: about 66 characters */\n  --measure: var(--measure-max);   /* the column in use: narrower on small desktop windows */\n\n  /* radii, rules, targets */\n  --r-ctl: 3px;              /* buttons, fields, tables */\n  --r-die: 5px;\n  --r-sheet: 14px;           /* People sheet, top corners */\n  --hair: 1px;\n  --tap: 44px;\n\n  /* desktop frame */\n  --bar: 56px;\n  --rail: 72px;\n  --col-left: 280px;\n  --col-right: 364px;\n  --stage-pad: 32px;         /* margin on each side of the reading column */\n}\n\n/* ---------- Base ---------- */\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nhtml, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; }\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody {\n  background: var(--paper);\n  color: var(--ink);\n  font: 400 var(--fs-ui)/1.4 var(--font-sans);\n  font-variant-numeric: tabular-nums lining-nums;\n  text-rendering: optimizeLegibility;\n}\np, h1, h2, h3, h4, h5, ul, ol, dl, dd { margin: 0; padding: 0; }\nul, ol { list-style: none; }\nh1, h2, h3, h4, h5 { font: inherit; }\nb { font-weight: 600; }\nbutton, input { font: inherit; color: inherit; }\nbutton {\n  margin: 0; padding: 0; border: 0; background: none; cursor: pointer;\n  border-radius: var(--r-ctl); -webkit-tap-highlight-color: transparent;\n}\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n::selection { background: var(--accent-wash); }\n\n/* Icons: hairline strokes that take the text colour */\n.i { flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }\n.i--sm { stroke-width: 2; }\n.i--solid { fill: currentColor; stroke: none; }\n.star { color: var(--accent); }\n.iconbtn { display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); }\n\n/* Capital labels: the small, spaced voice of the interface */\n.stat__k, .to__k, .check__kind, .check dt, .group, .person__label, .panel__title, .defs > dt, .thread__sub b {\n  font-family: var(--font-sans); font-size: var(--fs-xs); font-style: normal;\n  letter-spacing: var(--track-caps); text-transform: uppercase;\n}\n\n/* Bond pips: five dots, filled in the accent up to the bond level */\n.pips { display: inline-flex; flex: none; gap: 2px; vertical-align: middle; }\n.pips i { width: 7px; height: 7px; border-radius: 50%; border: var(--hair) solid var(--rule-strong); }\n.pips[data-v=\"1\"] i:nth-child(-n+1),\n.pips[data-v=\"2\"] i:nth-child(-n+2),\n.pips[data-v=\"3\"] i:nth-child(-n+3),\n.pips[data-v=\"4\"] i:nth-child(-n+4),\n.pips[data-v=\"5\"] i { background: var(--accent); border-color: var(--accent); }\n.pips--lg { gap: var(--s1); }\n.pips--lg i { width: 9px; height: 9px; }\n\n/* Numeric meters: a value with a ruled track */\n.stat { position: relative; display: inline-flex; align-items: baseline; gap: var(--s1); padding-bottom: 5px; }\n.stat__k { font-weight: 600; color: var(--ink-3); }\n.stat b { font-size: var(--fs-ui); font-weight: 700; }\n.stat__max { margin-left: -3px; color: var(--ink-2); }\n.stat__bar, .bar { background: linear-gradient(to right, var(--ink) calc(var(--v) * 100%), var(--rule-strong) 0); }\n.stat__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; }\n\n/* ---------- App frame (phone first) ---------- */\n.app { height: 100%; display: flex; flex-direction: column; }\n\n/* Top: a one-line header and a status line */\n.top {\n  flex: none; display: grid; align-items: center;\n  grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap);\n  grid-template-areas: \"menu head aa\" \"status status status\";\n  padding: 2px var(--s1) 0; border-bottom: var(--hair) solid var(--rule);\n}\n.top__brand, .book, .cost { display: none; }\n.top__menu { grid-area: menu; justify-items: start; padding-left: 12px; }   /* glyphs sit on the text margins */\n.top__aa { grid-area: aa; justify-items: end; padding-right: 16px; font: 400 var(--fs-story)/1 var(--font-serif); }   /* set at the reading size */\n.top__head { grid-area: head; min-width: 0; }\n.where {\n  font: 400 var(--fs-md)/1.2 var(--font-serif); text-align: center;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.where__time { color: var(--ink-2); }\n.status {\n  grid-area: status; display: flex; align-items: baseline; gap: var(--s4);\n  padding: 0 var(--s4) var(--s2); font-size: var(--fs-sm); line-height: 1.2; white-space: nowrap;\n}\n.stat--cost { margin-left: auto; color: var(--ink-2); }\n\n/* ---------- Stage: story log, people strip, dock ---------- */\n.stage { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }\n.stage::before {   /* scrolled text fades out under the header instead of being cut */\n  content: \"\"; position: absolute; z-index: 2; top: 0; left: 0; right: 0; height: var(--s2);\n  background: linear-gradient(var(--paper), var(--paper-0)); pointer-events: none;\n}\n.log {\n  flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;\n  display: flex; flex-direction: column;\n  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;\n  scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent;\n}\n.page {   /* the reading column; short logs sit at the foot, next to the dock */\n  flex: none; width: 100%; max-width: calc(var(--measure) + 2 * var(--gutter));\n  margin: auto auto 0; padding: 0 var(--gutter) var(--s5);\n  font: 400 var(--fs-story)/var(--lh-story) var(--font-serif);\n  font-variant-numeric: oldstyle-nums proportional-nums;\n  text-wrap: pretty;\n}\n.page > * + *, .beat > * + * { margin-top: .92em; }\n\n/* Scene heading: an asterism over spaced small caps */\n.scene { padding: var(--s6) 0 var(--s3); text-align: center; }\n.scene__mark { display: block; margin: 0 auto var(--s3); color: var(--ink-2); }\n.scene__title {\n  font: 400 var(--fs-md)/1.4 var(--font-serif); font-variant-caps: all-small-caps;\n  letter-spacing: var(--track-wide); margin-right: calc(-1 * var(--track-wide)); text-wrap: balance;\n}\n\n/* Narration: the first paragraph of a scene opens with a two-line initial. text-wrap: pretty skips\n   such a paragraph, so its last two words are tied with a no-break space in the markup. */\n@supports (initial-letter: 2) or (-webkit-initial-letter: 2) {\n  .narr--lead::first-letter {\n    -webkit-initial-letter: 2; initial-letter: 2;\n    font-family: var(--font-display); margin-right: .09em;\n  }\n}\n\n/* Speech: the speaker in small caps, the manner in italics */\n.who { font-weight: 700; font-variant-caps: all-small-caps; letter-spacing: .08em; margin-right: .12em; }\n.how { font-style: italic; color: var(--ink-2); }\n\n/* The player's action: set off by an accent rule and \"You\" */\n.page > .act { margin-top: 1.15em; margin-bottom: 1.15em; }\n.act { padding-left: var(--s4); border-left: 2px solid var(--accent); }\n.act__you {\n  font-weight: 700; font-variant-caps: all-small-caps; letter-spacing: var(--track-caps);\n  color: var(--accent); margin-right: .3em;\n}\n\n/* Dice check: a small table, as in a rulebook */\n.check {\n  border: var(--hair) solid var(--rule-strong); border-radius: var(--r-ctl);\n  font: 400 var(--fs-sm)/1.35 var(--font-sans); font-variant-numeric: tabular-nums lining-nums;\n}\n.check__cap {\n  display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px var(--s2);\n  padding: var(--s2) var(--s3); border-bottom: var(--hair) solid var(--rule);\n}\n.check__kind { font-weight: 700; }\n.check__what { font-size: var(--fs-ui); font-weight: 600; }\n.check__vs { flex-basis: 100%; color: var(--ink-2); }\n.check__vs b { color: var(--ink); }\n.check__cells { display: grid; grid-template-columns: 1.1fr .8fr 1.25fr; }\n.check__cells > div { min-width: 0; padding: var(--s2) var(--s3) 10px; }\n.check__cells > div + div { border-left: var(--hair) solid var(--rule); }\n.check dt { color: var(--ink-3); margin-bottom: 3px; }\n.check dd { display: flex; flex-direction: column; align-items: flex-start; }\n.check dd b { font-size: var(--fs-note); line-height: 1.3; }\n.check dd small { font-size: var(--fs-sm); color: var(--ink-2); }\n.check__ok { display: inline-flex; align-items: center; gap: var(--s1); }\n.die {\n  display: inline-grid; place-items: center; width: 30px; height: 30px; margin-top: 2px;\n  border: 1.25px solid var(--ink); border-radius: var(--r-die);\n  font: 700 var(--fs-md)/1 var(--font-sans);\n}\n\n/* System notes: footnotes under a short rule */\n.notes { margin-top: .7em !important; font: italic var(--fs-note)/1.5 var(--font-serif); color: var(--ink-2); }\n.notes::before { content: \"\"; display: block; width: var(--s8); margin-bottom: 6px; border-top: var(--hair) solid var(--ink-3); }\n.notes .pips { gap: 3px; margin: -2px 0 0 var(--s2); }\n.notes b { font-weight: 400; color: var(--ink); }\n\n/* People strip (phone): quiet text chips with bond pips */\n.strip {\n  flex: none; display: flex; align-items: stretch; height: 52px;\n  padding-right n          <button class=\"btn person__talk\" type=\"button\"><svg class=\"i\" width=\"19\" height=\"19\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n          <div class=\"person__more\">\n            <h5 class=\"person__label\">Shared memories</h5>\n            <ul class=\"memories memories--quotes\">\n              <li>“You shared your rations on the salt flats.”</li>\n              <li>“You did not use her as bait at the bridge.”</li>\n            </ul>\n            <div class=\"person__actions\">\n              <button class=\"btn btn--primary\" type=\"button\">Talk</button>\n              <button class=\"btn\" type=\"button\">Spend time together</button>\n              <button class=\"btn\" type=\"button\">Ask about…</button>\n            </div>\n          </div>\n          <button class=\"person__open\" type=\"button\" data-people-toggle aria-expanded=\"false\" aria-label=\"Mira: open or close profile\"></button>\n        </article>\n\n        <article class=\"person person--party\">\n          <h4 class=\"person__name\">Tobin</h4>\n          <span class=\"pips pips--lg\" data-v=\"1\" role=\"img\" aria-label=\"Bond 1 of 5\"><i></i><i></i><i></i><i></i><i></i></span>\n          <p class=\"person__meta\"><span>Tinkerer’s apprentice</span><span class=\"person__att\">curious</span></p>\n          <span class=\"person__bond\">Bond <b>1</b> of 5</span>\n          <button class=\"btn person__talk\" type=\"button\"><svg class=\"i\" width=\"19\" height=\"19\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n          <div class=\"person__more\">\n            <h5 class=\"person__label\">Shared memory</h5>\n            <ul class=\"memories memories--quotes\">\n              <li>“You paid for his broken lens.”</li>\n            </ul>\n            <div class=\"person__actions\">\n              <button class=\"btn btn--primary\" type=\"button\">Talk</button>\n              <button class=\"btn\" type=\"button\">Spend time together</button>\n              <button class=\"btn\" type=\"button\">Ask about…</button>\n            </div>\n          </div>\n        </article>\n\n        <h3 class=\"group\">Also here</h3>\n\n        <article class=\"person\">\n          <h4 class=\"person__name\">Captain Roth</h4>\n          <span class=\"person__nobond\">No bond yet</span>\n          <p class=\"person__meta\"><span>City Watch</span><span class=\"person__att\">wary</span><span class=\"person__nb\">no bond yet</span></p>\n          <button class=\"btn person__talk\" type=\"button\"><svg class=\"i\" width=\"19\" height=\"19\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n          <div class=\"person__more\">\n            <h5 class=\"person__label\">Note</h5>\n            <ul class=\"memories\">\n              <li>Suspects a courier carried the forged seal.</li>\n            </ul>\n          </div>\n        </article>\n\n        <article class=\"person\">\n          <h4 class=\"person__name\">Lantern seller</h4>\n          <p class=\"person__meta\"><span>A stranger</span><span class=\"person__att\">no details yet</span></p>\n          <button class=\"btn person__talk\" type=\"button\"><svg class=\"i\" width=\"19\" height=\"19\" aria-hidden=\"true\"><use href=\"#i-talk\"/></svg><span>Talk</span></button>\n        </article>\n      </div>\n    </aside>\n\n    <section class=\"panel map\" aria-label=\"Map\">\n      <h2 class=\"panel__title\">Map</h2>\n      <svg width=\"232\" height=\"190\" viewBox=\"0 0 232 190\" role=\"img\" aria-label=\"Old Mill, Lantern Market (you are here), Canal Bridge and Glass Road Waystation in a line; North Gate branches off Lantern Market; one undiscovered place lies beyond the waystation\">\n        <path class=\"map__line\" d=\"M80 176V56M80 136H22\"/>\n        <path class=\"map__line\" d=\"M80 56V23\" stroke-dasharray=\"2 4\"/>\n        <circle class=\"map__line\" cx=\"80\" cy=\"14\" r=\"9\" stroke-dasharray=\"2 3\"/>\n        <circle class=\"map__node\" cx=\"80\" cy=\"56\" r=\"4.5\"/>\n        <circle class=\"map__node\" cx=\"80\" cy=\"96\" r=\"4.5\"/>\n        <circle class=\"map__node\" cx=\"80\" cy=\"176\" r=\"4.5\"/>\n        <circle class=\"map__node\" cx=\"22\" cy=\"136\" r=\"4.5\"/>\n        <circle class=\"map__ring\" cx=\"80\" cy=\"136\" r=\"9\"/>\n        <circle class=\"map__dot\" cx=\"80\" cy=\"136\" r=\"5\"/>\n        <text class=\"map__q\" x=\"80\" y=\"18.3\" text-anchor=\"middle\">?</text>\n        <text x=\"98\" y=\"60.5\">Glass Road Waystation</text>\n        <text x=\"98\" y=\"100.5\">Canal Bridge</text>\n        <text class=\"map__here\" x=\"98\" y=\"133\">Lantern Market</text>\n        <text class=\"map__you\" x=\"98\" y=\"149\">you are here</text>\n        <text x=\"98\" y=\"180.5\">Old Mill</text>\n        <text x=\"0\" y=\"159\">North Gate</text>\n      </svg>\n    </section>\n  </div>\n\n  <\!-- Stage: the story -->\n  <main class=\"stage\">\n    <div class=\"log\" data-log role=\"log\" aria-label=\"Story\">\n      <div class=\"page\">\n\n        <header class=\"scene\">\n          <svg class=\"i scene__mark\" width=\"22\" height=\"19\" aria-hidden=\"true\"><use href=\"#i-asterism\"/></svg>\n          <h2 class=\"scene__title\">Scene 4 · Lantern Market · Dusk</h2>\n        </header>\n\n        <p class=\"narr narr--lead\">Paper lanterns sway above the market stalls as the last light drains out of the canal. By the bridge, Captain Roth turns a wax seal over in his gloved hand while two watchmen search a courier’s&nbsp;bag.</p>\n\n        <p class=\"say\"><span class=\"who\">Mira</span> <span class=\"how\">(whispering)</span> “He’s checking couriers. If he sees your satchel, we’re done. I can draw them off, or you talk your way through.”</p>\n\n        <p class=\"say\"><span class=\"who\">Tobin</span> “Or we wait for dark. I vote dark.”</p>\n\n        <p class=\"act\"><span class=\"act__you\">You</span> I walk up to Roth openly and ask whether the bridge is closed, keeping the satchel under my cloak.</p>\n\n        <section class=\"check\" aria-label=\"Dice check\">\n          <p class=\"check__cap\">\n            <span class=\"check__kind\">Skill test</span>\n            <span class=\"check__what\">Manipulation (bluff)&nbsp;· Medium</span>\n            <span class=\"check__vs\">Opposed by <b>Captain Roth</b></span>\n          </p>\n          <dl class=\"check__cells\">\n            <div><dt>Needed</dt><dd><b>4 or less</b><small>on one die</small></dd></div>\n            <div><dt>Rolled</dt><dd><span class=\"die\">2</span></dd></div>\n            <div><dt>Result</dt><dd><b class=\"check__ok\"><svg class=\"i i--sm\" width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"#i-check\"/></svg>Success</b><small>quality 2</small></dd></div>\n          </dl>\n        </section>\n\n        <p class=\"narr\">Roth’s eyes go from your face to your boots and back. “Bridge is open. Papers are not,” he says, but he is already looking past you at a cart with a broken axle. He waves you on.</p>\n\n        <div class=\"beat\" data-pending>\n          <p class=\"say\"><span class=\"who\">Mira</span> <span class=\"how\">(low, falling in beside you)</span> “You could have sent me in as the distraction. You didn’t.” A pause. “I noticed.”</p>\n          <div class=\"notes\">\n            <p>Bond with <b>Mira</b> rises from 3 to 4.<span class=\"pips\" data-v=\"4\" aria-hidden=\"true\"><i></i><i></i><i></i><i></i><i></i></span></p>\n          </div>\n        </div>\n\n        <div class=\"beat\" data-pending>\n          <p class=\"narr\">Behind you the cart finally gives way, and the whole market turns to look. The bridge ahead is empty, and beyond it the lamps of the Glass Road are being lit one by one.</p>\n          <div class=\"notes\">\n            <p>+1 experience · Goal progress: reach the Glass Road waystation.</p>\n            <p>10 minutes pass.</p>\n          </div>\n        </div>\n\n      </div>\n    </div>\n\n    <\!-- People strip (phone) -->\n    <div class=\"strip\" role=\"group\" aria-label=\"People with you and nearby\">\n      <div class=\"strip__list\">\n        <button class=\"chip\" type=\"button\" data-people-toggle>\n          <span class=\"chip__name\"><svg class=\"i i--solid star\" width=\"12\" height=\"12\" role=\"img\" aria-label=\"Favourite\"><use href=\"#i-star\"/></svg>Mira</span>\n          <span class=\"pips\" data-v=\"4\" data-bond-mira role=\"img\" aria-label=\"Bond 4 of 5\"><i></i><i></i><i></i><i></i><i></i></span>\n        </button>\n        <button class=\"chip\" type=\"button\" data-people-toggle>\n          <span class=\"chip__name\">Tobin</span>\n          <span class=\"pips\" data-v=\"1\" role=\"img\" aria-label=\"Bond 1 of 5\"><i></i><i></i><i></i><i></i><i></i></span>\n        </button>\n        <span class=\"strip__sep\" aria-hidden=\"true\"></span>\n        <button class=\"chip chip--more\" type=\"button\" data-people-toggle>\n          <span class=\"chip__name\">Captain Roth</span>\n          <span class=\"chip__sub\">City Watch</span>\n        </button>\n        <button class=\"chip chip--more\" type=\"button\" data-people-toggle>\n          <span class=\"chip__name\">Lantern seller</span>\n          <span class=\"chip__sub\">stranger</span>\n        </button>\n      </div>\n      <button class=\"strip__open\" type=\"button\" data-people-toggle aria-expanded=\"false\" aria-label=\"Open people panel\"><svg class=\"i i--sm\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-up\"/></svg><span>All</span></button>\n    </div>\n\n    <\!-- Dock: Continue, or the input with suggestions -->\n    <div class=\"dock\">\n      <div class=\"dock__in\">\n        <button class=\"continue\" type=\"button\" data-continue>\n          <span class=\"continue__in\"><span class=\"continue__label\">Continue</span><span class=\"continue__more\"><span data-continue-count>2</span> more</span></span>\n        </button>\n        <span class=\"dock__hint\">or press <kbd> ho copied the baron’s seal?</p>\n            <p class=\"thread__sub\"><b>Clue</b>Roth carries a copy.</p>\n          </div>\n        </dd>\n        <dt>Commitment</dt>\n        <dd>\n          <p class=\"thread__title\">Meet Tobin’s master at the Old Mill.</p>\n          <p class=\"thread__sub\"><b class=\"thread__due\">Due tonight</b></p>\n        </dd>\n      </dl>\n    </section>\n  </aside>\n</div>\n\n<button class=\"scrim\" type=\"button\" data-people-toggle tabindex=\"-1\" aria-label=\"Close people panel\"></button>\n\n<script>\n(function () {\n  var d = document, body = d.body;\n  var state = new URLSearchParams(location.search).get('state') || 'continue';\n  var pending = Array.prototype.slice.call(d.querySelectorAll('[data-pending]'));\n  var shown = (state === 'input' || state === 'people') ? pending.length : 0;\n  var log = d.querySelector('[data-log]');\n\n  function each(sel, fn) { Array.prototype.forEach.call(d.querySelectorAll(sel), fn); }\n  function within(e, sel) { return e.target && e.target.closest ? e.target.closest(sel) : null; }\n  function toEnd() { if (log) log.scrollTop = log.scrollHeight; }\n\n  function sync() {\n    pending.forEach(function (el, i) { el.hidden = i >= shown; });\n    var left = pending.length - shown;\n    body.dataset.mode = left > 0 ? 'continue' : 'input';\n    each('[data-continue-count]', function (c) { c.textContent = left; });\n    // Mira's bond rises from 3 to 4 in the first pending beat: keep the pips in step with the story.\n    var bond = shown > 0 ? 4 : 3;\n    each('[data-bond-mira]', function (el) { el.dataset.v = bond; el.setAttribute('aria-label', 'Bond ' + bond + ' of 5'); });\n    each('[data-bond-mira-n]', function (el) { el.textContent = bond; });\n    toEnd();\n  }\n  function people(open) {\n    body.dataset.people = open ? 'open' : '';\n    each('[data-people-toggle][aria-expanded]', function (b) { b.setAttribute('aria-expanded', open ? 'true' : 'false'); });\n  }\n  function next() { shown = Math.m use href=\"#i-heart\"/></svg><svg class=\"h4\" width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg><svg class=\"off\" width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg><span class=\"sr\">Bond <span class=\"b-old\">3</span><span class=\"b-new\">4</span> of 5</span></span>\n          </button>\n          <button type=\"button\" class=\"fig is-tobin\" data-who=\"tobin\" data-people-toggle>\n            <svg class=\"bust\" width=\"62\" height=\"68\" aria-hidden=\"true\"><use href=\"#b-tobin\"/></svg>\n            <span class=\"name\"><span class=\"nm\">Tobin</span></span>\n            <span class=\"hearts\"><svg width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg><svg class=\"off\" width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg><svg class=\"off\" width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg><svg class=\"off\" width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg><svg class=\"off\" width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg><span class=\"sr\">Bond 1 of 5</span></span>\n          </button>\n        </div>\n        <span class=\"troupe-label\">Party</span>\n      </div>\n      <div class=\"troupe\">\n        <div class=\"troupe-figs\">\n          <button type=\"button\" class=\"fig is-roth\" data-who=\"roth\" data-people-toggle>\n            <svg class=\"bust\" width=\"62\" height=\"68\" aria-hidden=\"true\"><use href=\"#b-roth\"/></svg>\n            <span class=\"name\"><span class=\"nm\">Captain Roth</span></span>\n            <span class=\"nobond\">No bond yet</span>\n          </button>\n          <button type=\"button\" class=\"fig is-seller\" data-who=\"seller\" data-people-toggle>\n            <svg class=\"bust\" width=\"62\" height=\"68\" aria-hidden=\"true\"><use href=\"#b-seller\"/></svg>\n            <span class=\"name\"><span class=\"nm\">Lantern seller</span></span>\n            <span class=\"nobond\">Stranger</span>\n          </button>\n        </div>\n        <span class=\"troupe-label\">Also here</span>\n      </div>\n    </div>\n  </section>\n\n  <div class=\"log\" data-log tabindex=\"0\" role=\"region\" aria-label=\"Story log\">\n    <div class=\"log-col\">\n\n      <h2 class=\"beat scene-head\">Scene 4 · Lantern Market · Dusk</h2>\n\n      <article class=\"beat narr is-narr\">\n        <header class=\"who\"><b class=\"tag\">Narrator</b></header>\n        <p>Paper lanterns sway above the market stalls as the last light drains out of the canal. By the bridge, Captain Roth turns a wax seal over in his gloved hand while two watchmen search a courier's bag.</p>\n      </article>\n\n      <article class=\"beat speech is-mira\" data-focus=\"mira\">\n        <header class=\"who\"><b class=\"tag\">Mira</b><i class=\"manner\">whispering</i></header>\n        <p>\"He's checking couriers. If he sees your satchel, we're done. I can draw them off, or you talk your way through.\"</p>\n      </article>\n\n      <article class=\"beat speech is-tobin\" data-focus=\"tobin\">\n        <header class=\"who\"><b class=\"tag\">Tobin</b></header>\n        <p>\"Or we wait for dark. I vote dark.\"</p>\n      </article>\n\n      <article class=\"beat act is-aren\">\n        <header class=\"who\"><b class=\"tag\">Aren</b><i class=\"manner\">your action</i></header>\n        <p>I walk up to Roth openly and ask whether the bridge is closed, keeping the satchel under my cloak.</p>\n      </article>\n\n      <article class=\"beat check\" aria-label=\"Dice check\">\n        <span class=\"die\" aria-hidden=\"true\"></span>\n        <p class=\"check-t\">Skill test · Manipulation (bluff) · Medium</p>\n        <p class=\"check-l\">Needed <b>4 or less</b> on one die · Rolled <b>2</b></p>\n        <p class=\"check-f\"><span class=\"check-ok\"><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-check\"/></svg>Success <span>· quality 2</span></span><span>Opposed by Captain Roth</span></p>\n      </article>\n\n      <article class=\"beat narr is-narr\" data-focus=\"roth\">\n        <header class=\"who\"><b class=\"tag\">Narrator</b></header>\n        <p>Roth's eyes go from your face to your boots and back. \"Bridge is open. Papers are not,\" he says, but he is already looking past you at a cart with a broken axle. He waves you on.</p>\n      </article>\n\n      <div class=\"pend\" data-pending>\n        <article class=\"beat speech is-mira\" data-focus=\"mira\">\n          <header class=\"who\"><b class=\"tag\">Mira</b><i class=\"manner\">low, falling in beside you</i></header>\n          <p>\"You could have sent me in as the distraction. You didn't.\" <span class=\"aside\">A pause.</span> \"I noticed.\"</p>\n          <ul class=\"notes\"><li class=\"note bond\"><svg class=\"ic f\" width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"#i-heart\"/></svg>Bond with Mira rises from 3 to 4</li></ul>\n        </article>\n      </div>\n\n      <div class=\"pend\" data-pending>\n        <article class=\"beat narr is-narr\">\n          <header class=\"who\"><b class=\"tag\">Narrator</b></header>\n          <p>Behind you the cart finally gives way, and the whole market turns to look. The bridge ahead is empty, and beyond it the lamps of the Glass Road are being lit one by one.</p>\n          <ul class=\"notes\">\n            <li class=\"note xp\"><svg class=\"ic f\" width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"#i-spark\"/></svg>+1 experience</li>\n            <li class=\"note goal\"><svg class=\"ic\" width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"#i-flag\"/></svg>Goal progress: reach the Glass Road waystation</li>\n          </ul>\n          <p class=\"time\"><svg class=\"ic\" width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"#i-clock\"/></svg>10 minutes pass</p>\n        </article>\n      </div>\n\n      <div class=\"mid\">\n        <div class=\"choices\" role=\"group\" aria-label=\"Suggested actions\">\n          <button type=\"button\" class=\"choice\"><span class=\"n\"><b>1</b></span><span>Cross the bridge now</span><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-chev\"/></svg></button>\n          <button type=\"button\" class=\"choice\"><span class=\"n\"><b>2</b></span><span>Ask Mira what she saw at the stalls</span><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-chev\"/></svg></button>\n          <button type=\"button\" class=\"choice\"><span class=\"n\"><b>3</b></span><span>Take a closer look at the cart</span><svg class=\"ic\" width=\"16\" height=\"16\" aria-hidden=\"true\"><use href=\"#i-chev\"/></svg></button>\n        </div>\n      </div>\n\n      <div class=\"dock\">\n        <div class=\"go\">\n          <button type=\"button\" class=\"btn-go\" data-continue>\n            <span>Continue</span>\n            <span class=\"count\"><b data-continue-count>2</b> left</span>\n            <svg class=\"ic\" width=\"20\" height=\"20\" aria-hidden=\"true\"><use href=\"#i-chev\"/></svg>\n          </button>\n          <p class=\"go-hint\">Press <kbd>Space</kbd> to continue · scroll up to reread</p>\n        </div>\n        <div class=\"say\">\n          <button type=\"button\" class=\"to\" aria-label=\"Speak to: everyone\">To: <b>Everyone</b><svg class=\"ic\" width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"#i-down\"/></svg></button>\n          <input type=\"text\" placeholder=\"What do you do?\" aria-label=\"What do you do?\" autocomplete=\"off\">\n          <button type=\"button\" class=\"send\" aria-label=\"Send\"><svg class=\"ic\" width=\"20\" height=\"20\" aria-hidden=\"true\"><use href=\"#i-send\"/></svg></button>\n        </div>\n      </div>\n\n    </div>\n  </div>\n</main>\n\n<aside class=\"side\" aria-label=\"Character and journal\">\n  <section class=\"card sheet\" aria-label=\"Character\">\n    <div class=\"card-h\"><h2>Aren</h2><span class=\"sub\">Protagonist</span><span class=\"end\">Experience <b>14</b></span></div>\n    <div class=\"meter hp\"><span>Hit points</span><span class=\"bar\"><i style=\"width:80%\"></i></span><span class=\"v\">12<small>/15</small></span></div>\n    <div class=\"meter en\"><span>Energy</span><span class=\"bar\"><i style=\"width:60%\"></i></span><span class=\"v\">9<small>/15</small></span></div>\n    <p class=\"destiny\"><svg class=\"ic f\" width=\"13\" height=\"13\" aria-hidden=\"true\"><use href=\"#i-gem\"/></svg><svg class=\"ic f\" width=\"13\" height=\"13\" aria-hidden=\"true\"><use href=\"#i-gem\"/></svg>Destiny points <b>2</b></p>\n    <div class=\"attrs\">\n      <div><b>1</b><span>Strength</span></div>\n      <div><b>3</b><span>Skill</span></div>\n      <div><b>3</b><span>Resistance</span></div>\n      <div><b>1</b><span>Armor</span></div>\n      <div class=\"zero\"><b>0</b><span>Firepower</span></div>\n    </div>\n    <dl class=\"defs\">\n      <dt>Paths</dt><dd class=\"chips\"><span class=\"chip air\">Air <i>2</i></span><span class=\"chip light\">Light <i>1</i></span></dd>\n      <dt>Abilities</dt><dd class=\"chips\"><span class=\"chip\">Featherstep <i>Air 1</i></span><span class=\"chip\">Gale Push <i>Air 2</i></span><span class=\"chip\">Glimmer <i>Light 1</i></span></dd>\n      <dt>Advantages</dt><dd><span class=\"nb\">Quick Reflexes</span> · <span class=\"nb\">Patron: Couriers' Guild</span></dd>\n      <dt>Skills</dt><dd>Manipulation · Survival</dd>\n    </dl>\n  </section>\n  <section class=\"card journal\" aria-label=\"Journal\">\n    <div class=\"card-h\"><h2>Journal</h2><span class=\"sub\">2 threads · 1 commitment</span></div>\n    <ul class=\"threads\">\n      <li><p class=\"th-t\">Deliver the sealed letter to the Glass Road waystation.</p><p class=\"th-n\"><b>Next:</b> cross the bridge before the gates close.</p></li>\n      <li><p class=\"th-t\">Who copied the baron's seal?</p><p class=\"th-n\"><b>Clue:</b> Roth carries a copy.</p></li>\n    </ul>\n    <div class=\"commit\"><svg class=\"ic\" width=\"18\" height=\"18\" aria-hidden=\"true\"><use href=\"#i-clock\"/></svg><div><span class=\"lbl\">Commitment · due tonight</span><p>Meet Tobin's master at the Old Mill.</p></div></div>\n  </section>\n</aside>\n\n<nav class=\"nav\" aria-label=\"Primary\">\n  <button type=\"button\" class=\"on\" aria-current=\"page\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-story\"/></svg>Story</button>\n  <button type=\"button\" data-people-toggle><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-people\"/></svg>People</button>\n  <button type=\"button\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-char\"/></svg>Character</button>\n  <button type=\"button\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-journal\"/></svg>Journal</button>\n  <button type=\"button\"><svg class=\"ic\" width=\"22\" height=\"22\" aria-hidden=\"true\"><use href=\"#i-map\"/></svg>Map</button>\n</nav>\n\n<button type=\"button\" class=\"scrim\" data-people-toggle aria-label=\"Close people panel\" tabindex=\"-1\"></button>\n\n</div>\n\n<script>\n(function () {\n  var state = new URLSearchParams(location.search).get('state') || 'continue';\n  var body = document.body;\n  var log = document.querySelector('[data-log]');\n  var cast = document.querySelector('[data-cast]');\n  var pending = Array.prototype.slice.call(document.querySelectorAll('[data-pending]'));\n  var beats = Array.prototype.slice.call(log.querySelectorAll('.beat'));\n  var figs = Array.prototype.slice.call(document.querySelectorAll('.fig'));\n  var shown = (state === 'input' || state === 'people') ? pending.length : 0;\n\n  function sync() {\n    pending.forEach(function (el, i) { el.hidden = i >= shown; });\n    var left = pending.length - shown;\n    body.dataset.mode = left > 0 ? 'continue' : 'input';\n    body.classList.toggle('bond-up', shown >= 1);\n    document.querySelectorAll('[data-continue-count]').forEach(function (c) { c.textContent = left; });\n\n    /* the newest visible beat becomes the dialogue box and its speaker steps into the light */\n    var now = null;\n    beats.forEach(function (b) {\n      b.classList.remove('is-now');\n      var group = b.closest('[data-pending]');\n      if (!group || !group.hidden) now = b;\n    });\n    if (now) now.classList.add('is-now');\n    var who = now ? now.getAttribute('data-focus') : null;\n    figs.forEach(function (f) { f.classList.toggle('is-speaking', !!who && f.getAttribute('data-who') === who); });\n    cast.classList.toggle('has-focus', !!who);\n\n    log.scrollTop = log.scrollHeight;\n  }\n\n  if (state === 'people') body.dataset.people = 'open';\n\n  document.addEventListener('click', function (e) {\n    if (e.target.closest('[data-continue]')) { shown = Math.min(pending.length, shown + 1); sync(); }\n    if (e.target.closest('[data-people-toggle]')) {\n      body.dataset.people = body.dataset.people === 'open' ? '' : 'open';\n    }\n  });\n  /* scrolled up to reread: the dock detaches from the dialogue box */\n  log.addEventListener('scroll', function () {\n    body.classList.toggle('is-reading', log.scrollHeight - log.clientHeight - log.scrollTop > 24);\n  }, { passive: true });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') body.dataset.people = '';\n    if (e.key === ' ' && e.target === body && body.dataset.mode === 'continue') {\n      e.preventDefault(); shown = Math.min(pending.length, shown + 1); sync();\n    }\n  });\n  sync();\n})();\n<\/script>\n</body>\n</html>\n","arcade-hud":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Bitor Quest - Play (Arcade HUD)</title>\n<style>\n/* ---------- Design tokens ---------- */\n:root {\n  color-scheme: dark;\n  /* surfaces */\n  --bg-0: #060A13;      /* app background */\n  --bg-1: #0B111E;      /* panel */\n  --bg-2: #111A2B;      /* raised panel, control, newest entry */\n  --bg-3: #18243A;      /* hover, pressed */\n  /* borders */\n  --line: #1F2C44;      /* quiet divider */\n  --line-2: #31456A;    /* panel border */\n  --line-3: #4F6B99;    /* control border (3:1 on every surface) */\n  /* text */\n  --text: #E8EEF8;      /* story and primary text */\n  --text-2: #AEBCD3;    /* secondary */\n  --text-3: #8799B6;    /* labels, hints */\n  /* palette */\n  --cyan: #3FD8F2;\n  --amber: #FFB938;\n  --pink: #FF6FAE;\n  --green: #4BE08C;\n  --red: #FF5F6B;\n  /* colour roles */\n  --accent: var(--cyan);    /* primary accent, active control, the player */\n  --energy: var(--cyan);    /* energy bar */\n  --hp: var(--red);         /* hit points, failure */\n  --dice: var(--amber);     /* dice, destiny */\n  --warn: var(--amber);     /* warnings, deadlines, attention */\n  --bond: var(--pink);      /* bonds, favourites, companion actions */\n  --success: var(--green);  /* success, gains */\n  --ink-accent: #04141A;    /* text on an accent fill */\n  --ink-dice: #1A1203;      /* text on a dice fill */\n  --seg-off: #2D3C5B;       /* empty gauge segment */\n  /* character hues (speaker tags and avatars) */\n  --c-mira: #C4A6FF;\n  --c-tobin: #CFE36A;\n  --c-roth: #9DB4D6;\n  --c-extra: #8799B6;\n  /* fonts */\n  --font-story: \"Segoe UI Variable Text\", \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Segoe UI Variable Text\", \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-tech: Bahnschrift, \"Roboto Condensed\", \"sans-serif-condensed\", \"Segoe UI\", sans-serif;\n  --font-mono: \"Cascadia Mono\", Consolas, \"Roboto Mono\", monospace;\n  /* type scale */\n  --fs-xs: 12px;        /* labels, tags */\n  --fs-sm: 13px;        /* numbers, system lines */\n  --fs-md: 14px;        /* interface text */\n  --fs-body: 15px;      /* menus, memories */\n  --fs-lg: 16px;        /* names, inputs, primary button */\n  --fs-xl: 20px;        /* outcome readout */\n  --fs-story: 16.5px;   /* story text (18px on desktop) */\n  --lh-story: 1.6;\n  /* spacing */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 24px;\n  --s-6: 32px;\n  /* radii */\n  --r-1: 2px;           /* tags, segments, avatars */\n  --r-2: 4px;           /* panels, buttons */\n  --r-3: 6px;           /* sheets */\n  /* layout (desktop dashboard) */\n  --w-people: 356px;    /* people and party column */\n  --w-side: 400px;      /* character, journal and map column */\n  --w-story: 600px;     /* reading measure of the story column */\n  /* effects */\n  --glow: 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 30%, transparent);\n}\n\n/* ---------- Base ---------- */\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nhtml, body { height: 100%; margin: 0; }\nbody {\n  height: 100dvh; overflow: hidden;\n  background: var(--bg-0); color: var(--text);\n  font: 400 var(--fs-md)/1.4 var(--font-ui);\n  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;\n  display: grid;\n  grid-template-columns: 100%;\n  grid-template-rows: auto minmax(0, 1fr) auto;\n  grid-template-areas: \"hud\" \"main\" \"nav\";\n}\nh1, h2, h3, p, ul, ol { margin: 0; padding: 0; }\nul, ol { list-style: none; }\nbutton { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }\nbutton:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\nsvg { display: block; flex: none; }\n.ic { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }\n.ic--solid { fill: currentColor; stroke: none; }\n.d-only { display: none; }\n\n.lbl { font: 600 var(--fs-xs)/1 var(--font-tech); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }\n.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n\n/* segmented gauge: --v of --max segments lit in --c; the last segment ends flush with the right edge */\n.seg {\n  --max: 5; --v: 0; --c: var(--bond); --gap: 2px;\n  --unit: calc((100% + var(--gap)) / var(--max));\n  display: block; height: 8px; min-width: 30px;\n  background: linear-gradient(90deg, var(--c) calc(var(--v) * var(--unit) - var(--gap) / 2), var(--seg-off) 0);\n  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(var(--unit) - var(--gap)), transparent 0 var(--unit));\n  mask: repeating-linear-gradient(90deg, #000 0 calc(var(--unit) - var(--gap)), transparent 0 var(--unit));\n}\n\n/* small bordered tag */\n.tag {\n  --c: var(--text-2);\n  display: inline-flex; align-items: center; gap: 4px; flex: none;\n  font: 700 var(--fs-xs)/1 var(--font-tech); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;\n  color: var(--c); padding: 4px 6px; border-radius: var(--r-1);\n  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);\n  background: color-mix(in srgb, var(--c) 10%, transparent);\n}\n\n/* monogram avatar */\n.ava {\n  --sz: 28px;\n  position: relative; flex: none; display: grid; place-items: center;\n  width: var(--sz); height: var(--sz); border-radius: var(--r-1);\n  font: 700 var(--fs-sm)/1 var(--font-tech); letter-spacing: .02em; color: var(--c, var(--text-2));\n  border: 1px solid color-mix(in srgb, var(--c, var(--text-3)) 70%, transparent);\n  background: color-mix(in srgb, var(--c, var(--text-3)) 14%, var(--bg-1));\n}\n.ava .fav { position: absolute; top: -7px; right: -7px; color: var(--bond); stroke: var(--bg-1); stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }\n\n.iconbtn { display: grid; place-items: center; width: 44px; height: 44px; color: var(--text-2); border-radius: var(--r-2); }\n\n/* ---------- Heads-up display (phone) ---------- */\n.hud {\n  grid-area: hud;\n  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto;\n  grid-template-areas: \"menu story cost\" \"menu place cost\" \"vit vit vit\";\n  align-items: center; column-gap: var(--s-2);\n  padding: var(--s-1) var(--s-3) var(--s-2) var(--s-1);\n  background: var(--bg-1); border-bottom: 1px solid var(--line-2);\n}\n.hud-menu { grid-area: menu; }\n.brand { display: none; }\n.hud-story { grid-area: story; align-self: end; display: flex; align-items: baseline; gap: var(--s-2); min-width: 0; margin-left: -6px; white-space: nowrap; overflow: hidden; }\n.hud-title { flex: none; font: 700 var(--fs-md)/1.25 var(--font-tech); letter-spacing: .09em; text-transform: uppercase; color: var(--text); }\n.hud-chap { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 600 var(--fs-xs)/1.25 var(--font-tech); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }\n/* place and time: if space runs out the place name shortens, the time of day and the day never do */\n.hud-place { grid-area: place; align-self: start; display: flex; align-items: center; min-width: 0; margin-left: -6px; font: 600 var(--fs-xs)/1.4 var(--font-tech); letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }\n.hud-place .ic { color: var(--accent); margin-right: 5px; }\n.hud-place .pl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }\n.hud-place .tm { flex: none; white-space: pre; }\n.hud-place b { font-weight: 600; color: var(--warn); }\n\n.cost {\n  grid-area: cost; display: flex; align-items: center; gap: 6px;\n  min-height: 44px; padding: 0 var(--s-2); border: 1px solid var(--line-3); border-radius: var(--r-2); background: var(--bg-0);\n}\n.cost > .ic { color: var(--success); }\n.cost-cell { display: grid; gap: 4px; }\n.cost-cell .num { grid-column: 1 / -1; font-size: var(--fs-sm); line-height: 1; color: var(--text); }\n.cost-cell .seg { display: none; }\n.cost-cell.d-only { display: none; }\n\n.vitals { grid-area: vit; display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--s-4); align-items: end; padding: var(--s-2) 0 0 var(--s-2); }\n.vital { display: grid; grid-template-columns: auto 1fr; align-items: baseline; row-gap: 5px; column-gap: var(--s-2); min-width: 0; }\n.vital .lbl { color: var(--c); }\n.vital .num { justify-self: end; font-size: var(--fs-xs); line-height: 1; color: var(--text-3); }\n.vital .num b { font-size: var(--fs-sm); font-weight: 700; color: var(--text); }\n.vital .seg, .vital .pips { grid-column: 1 / -1; }\n.vital--hp { --c: var(--hp); }\n.vital--en { --c: var(--energy); }\n.vital--dp { --c: var(--dice); }\n.pips { display: flex; align-items: center; gap: 6px; height: 8px; padding-left: 2px; }\n.pips i { width: 8px; height: 8px; background: var(--dice); transform: rotate(45deg); border-radius: 1px; }\n\n/* ---------- Story column ---------- */\n.story { grid-area: main; min-height: 0; min-width: 0; display: flex; flex-direction: column; }\n.log {\n  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;\n  padding: var(--s-3) var(--s-3) var(--s-4);\n  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;\n}\n.log-in > * + *, [data-pending] > * + * { margin-top: var(--s-3); }\n\n.scene { display: flex; align-items: center; gap: var(--s-3); font: 600 var(--fs-xs)/1 var(--font-tech); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); padding: var(--s-1) 0; }\n.scene::before, .scene::after { content: \"\"; flex: 1; height: 1px; background: var(--line-2); }\n\n.entry { position: relative; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--bg-1); padding: var(--s-3) 14px 13px; }\n.entry p { font: 400 var(--fs-story)/var(--lh-story) var(--font-story); color: var(--text); text-wrap: pretty; }\n.entry .aside { color: var(--text-2); }\n\n/* newest revealed entry: focus brackets */\n.entry[data-new] { background: var(--bg-2); border-color: var(--line-2); }\n.entry[data-new]::before, .entry[data-new * + *, [data-pending] > * + * { margin-top: 14px; }\n  .entry { padding: 14px 20px 15px; }\n  .roll-head { padding-left: 20px; }\n  .roll-body { padding: 14px 20px 12px; gap: var(--s-4); }\n  .roll-foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s-4); padding: 0 20px 14px; }\n  .roll-legend { display: grid; justify-items: end; gap: 3px; margin: 0; }\n  .sys li { gap: 10px; }\n  .sys .tag { width: 52px; }\n  .sys .seg { width: 44px; margin-left: var(--s-1); }\n  .control { padding: var(--s-3) var(--s-5) var(--s-4); }\n  .sugg button { min-height: 40px; }\n\n  .side { grid-area: side; display: flex; flex-direction: column; gap: var(--s-3); min-height: 0; padding: var(--s-3); overflow-y: auto; border-left: 1px solid var(--line-2); scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }\n}\n\n/* a wide top bar has room for level pips beside the turn and session figures */\n@media (min-width: 1400px) {\n  .hud { gap: var(--s-4); }\n  .cost-cell { grid-template-columns: auto auto; justify-content: start; align-items: center; column-gap: 6px; }\n  .cost-cell .seg { display: block; width: 28px; min-width: 0; height: 4px; --c: var(--success); }\n}\n\n/* a top bar too narrow for the full chapter line shows the short form instead of cutting it */\n@media (min-width: 1100px) and (max-width: 1319.98px) {\n  .hud-chap .d-only { display: none; }\n  .hud-chap .p-only { display: revert; }\n}\n\n/* narrow desktop windows: the room goes to the story column, not to the side columns */\n@media (min-width: 1100px) and (max-width: 1279.98px) {\n  :root { --w-people: 320px; --w-side: 368px; --fs-story: 17.5px; }\n  .log, .control { padding-left: var(--s-3); padding-right: var(--s-3); }\n  .entry, .roll-body { padding-left: var(--s-4); padding-right: var(--s-4); }\n  .roll-head { padding-left: var(--s-4); }\n  .roll-foot { display: block; padding-left: var(--s-4); padding-right: var(--s-4); }\n  .roll-legend { display: flex; gap: var(--s-2); margin-top: 7px; }\n  .sheet .pnl-h .lbl:not(.dp) { display: none; }\n  .map text { font-size: 13px; }\n}\n\n@media (prefers-reduced-motion: no-preference) {\n  .continue, .act, .chip, .sugg button, .tab, .to, .send, .p-more, .iconbtn { transition: background-color .12s, border-color .12s, color .12s; }\n}\n@media (hover: hover) {\n  .sugg button:hover, .act:hover, .chip:hover, .to:hover, .p-more:hover, .hud-menu:hover { background: var(--bg-3); }\n  .act--pri:hover { background: color-mix(in srgb, var(--bond) 26%, var(--bg-1)); }\n  .continue:hover { background: color-mix(in srgb, var(--accent) 24%, var(--bg-1)); }\n  .send:hover { background: color-mix(in srgb, var(--accent) 82%, #fff); }\n  .iconbtn:hover { color: var(--text); }\n}\n</style>\n</head>\n<body data-mode=\"continue\">\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\" focusable=\"false\">\n  <defs>\n    <symbol id=\"i-menu\" viewBox=\"0 0 24 24\"><path d=\"M4 7h16M4 12h16M4 17h16\"/></symbol>\n    <symbol id=\"i-story\" viewBox=\"0 0 24 24\"><path d=\"M12 7v12M4 5h5a3 3 0 0 1 3 3 3 3 0 0 1 3-3h5v13h-5a3 3 0 0 0-3 2 3 3 0 0 0-3-2H4z\"/></symbol>\n    <symbol id=\"i-people\" viewBox=\"0 0 24 24\"><path d=\"M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 19c0-3 2.7-5 6-5s6 2 6 5M16 5.2a3 3 0 0 1 0 5.6M21 19c0-2.3-1.4-4-3.5-4.7\"/></symbol>\n    <symbol id=\"i-char\" viewBox=\"0 0 24 24\"><path d=\"M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2.2 2.2L15 10\"/></symbol>\n    <symbol id=\"i-journal\" viewBox=\"0 0 24 24\"><path d=\"M6 4h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6zM6 4v16M10 8.5h4.5M10 12h4.5\"/></symbol>\n    <symbol id=\"i-map\" viewBox=\"0 0 24 24\"><path d=\"M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14\"/></symbol>\n    <symbol id=\"i-send\" viewBox=\"0 0 24 24\"><path d=\"M5 12h13M12 6l6 6-6 6\"/></symbol>\n    <symbol id=\"i-chev\" viewBox=\"0 0 24 24\"><path d=\"M9 6l6 6-6 6\"/></symbol>\n    <symbol id=\"i-down\" viewBox=\"0 0 24 24\"><path d=\"M6
